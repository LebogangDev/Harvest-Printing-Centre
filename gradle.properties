org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---------------------------------------------------------------------------
# Harvest app settings (read by app/build.gradle.kts and exposed as BuildConfig)
# You can override either value in local.properties (which is NOT committed).
# ---------------------------------------------------------------------------

# Base URL of Given's hosted API. MUST end with "/". Replace the placeholder
# with the real address once Given shares it (see README, section "Given's API").
harvest.apiBaseUrl=https://harvest-printing-api.onrender.com

# "Web client ID" from Firebase console > Authentication > Sign-in method >
# Google (it ends in .apps.googleusercontent.com). Needed for Google sign-in.
# It is an identifier, not a secret, so it is fine to commit it.
harvest.webClientId=1015894959744-7po97t4902pntkp76ts92bqs8jq8csdq.apps.googleusercontent.com